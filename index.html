<div class="sky"><div class="cloud"></div></div>
<style>
.sky{height:100vh;background:#87ceeb;overflow:hidden;position:relative}
.cloud{position:absolute;top:80px;left:-200px;width:120px;height:40px;
  background:#fff;border-radius:40px;animation:move 15s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;
  background:#fff;border-radius:50%}
.cloud::before{width:50px;height:50px;top:-25px;left:15px}
.cloud::after{width:70px;height:70px;top:-35px;left:50px}
@keyframes move{to{left:100%}}
</style>
